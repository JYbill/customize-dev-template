config-version: 8

server:
  # 服务端口号
  port: 8317

  # 开启TLS协议，默认tls.enable=false
  tls:
    enable: false
    cert: ""
    key: ""

  # 禁用高开销中间件以降低内存占用，默认false。为true则关闭日志
  commercial-mode: false


# 管理API设置
management:
  # 默认false：仅允许localhost访问管理接口（仍需要密钥验证）
  # true：允许远程地址访问管理接口
  allow-remote: true
  # 访问管理接口的密钥。如果提供明文密钥，启动时会自动哈希加密并写回config.yaml文件。留空则完全禁用管理API（所有/v0/management 路由返回 404）
  secret-key: ""
  # 禁用控制面板资源下载，使用自定义管理面板适合为true
  disable-control-panel: false

access:

  # 访问cliproxyapi代理所需要的API密钥列表
  api-keys:
    - "your-api-key-1"


# round-robin (default), fill-first(用完一下再切换下一个)
# ⚠️ 如果上游进入cool-down状态时，会使用下一个同名模型其他上游供应商
routing:
  strategy: "fill-first"
  # 默认false，true则为启用粘性会话。为false则启用routing.strategy策略
  session-affinity: true
  # 粘性会话缓存多少时间
  session-affinity-ttl: "1h"

  # 默认false，强制使用前缀匹配模型名（xxx/gpt-4.1），而不是直接用gpt-4.1匹配。推荐false这样可以配合`routing.strategy`实现负载均衡
  force-model-prefix: false
  retry:

    # http状态码为：403, 408, 500, 502, 503, 504时，重试请求的次数。默认：0
    request-retry: 0

    # 当所有的模型供应商的额度耗尽之后，每次请求CLIProxyAPI都会触发最大等待时长，默认30s
    max-retry-interval: 0

requests:

  # 代理URL. 支持socks5/http/https协议. 比如: socks5://user:pass@192.168.1.1:1080/
  proxy-url: ""

  # 非流式响应保活，默认0关闭，单位为秒，每N秒吐空行。目的在于避免nginx网关因为长时间上游无响应而直接断开链接
  nonstream-keepalive-interval: 30
  # SSE行为
  streaming:
    # 默认0禁用，当<=0禁用，用于ws、SSE的心跳包发送的间隔（包内容："\n\n"）
    keepalive-seconds: 0
    # 默认0，在没有任何数据发送下，发生错误时的重试次数，0表示不重试
    bootstrap-retries: 0

  # 设置请求体
  payload:
    # 默认规则：仅在请求载荷中缺少参数时设置的默认值
    default:
      - models:
          - name: "gemini-2.5-pro" # 支持通配符，如 "gemini-*"
            protocol: "gemini" # 限定协议类型，可选：openai、gemini、claude、codex
        params: # 参数设置（使用 gjson/sjson 路径语法）
          "generationConfig.thinkingConfig.thinkingBudget": 32768 # 思考预算配置

    # 覆盖规则：始终覆盖请求参数
    override:
      - models:
          - name: "gpt-*" # 支持通配符匹配多个模型
            protocol: "codex" # 限定为 Codex 协议
        params:
          "reasoning.effort": "high" # 推理努力程度设置为高

oauth:

  # 存储认证令牌的目录（如果需要设置到其他地方，可以参考文档：https://help.router-for.me/configuration/storage/pgsql.html）
  auth-dir: "~/.cli-proxy-api"
  providers:
    aistudio:

      # ws连接(/v1/ws)启用认证
      ws-auth: true
    claude:
      # 以下为 v8.0.8 的 Claude OAuth 配置；API Key 的伪装行为在 api-keys.claude 中单独配置。
      # 默认 false：额度耗尽时冷却整个凭据；true：只冷却本次请求的模型。
      model-level-cooling: false
      # 默认 false：自动对非 Claude Code 客户端进行请求伪装。
      # true：禁用 Claude Code 身份伪装和系统提示词替换，透传原始系统提示词。
      # 单个 OAuth 凭据文件中的 cloak_mode 可以覆盖此设置。
      disable-claude-cloak-mode: false
      claude-code:
        # true：Anthropic 模型列表返回原始模型 ID；默认 false：返回伪装后的模型 ID。
        # 此项只控制模型列表中的名称，不控制请求伪装。
        disable-cloaking-model-list: true
      # 使用 v8.0.8 内置指纹默认值，仅启用按凭据固定指纹。
      header-defaults:
        # user-agent: "claude-cli/2.1.280 (external, cli)"
        # package-version: "0.112.1"
        # runtime-version: "v26.3.0"
        # os: "MacOS"
        # arch: "arm64"
        # timeout: "600"
        # timezone: "" # 默认使用凭据时区，未指定则使用 CPA 进程的本地时区。
        # 默认 false；true：CPA 按凭据固定请求头指纹（版本、OS、架构），取配置值或内置默认值。
        stabilize-device-profile: true

    codex:
      # 默认 false：冷却整个凭据；true：只冷却本次请求的模型。
      model-level-cooling: false
      # 默认 false：仅对 responses ws 在生成过程中继续发送输入。
      response-steering: false
      # 默认 false；CPA 向上游发送请求时，强制设置官方 Codex 的 User-Agent 和 Originator（不区分是否为codex cli）
      disable-codex-cloaking: false

      # 当上游发生错误时方便进行重试或换模型供应商重试
      # 默认 false；true：暂存握手、心跳和空内容帧，延后向客户端提交响应。
      stream-bootstrap-buffering: false
      # 仅配合上述缓冲使用；默认 "0"：无时间上限，仍受 48 帧和 1 MiB 缓冲预算限制。
      # 可设 "20s"：达到时限后释放缓冲
      stream-bootstrap-timeout: "0"

      # 默认 false；true：适配官方 Codex 客户端的多 Agent 请求格式。
      optimize-multi-agent-v2: false
      # 默认 false，Codex + Codex OAuth 通常无需开启；仅当带 X-Openai-Subagent: collab_spawn 的 codex_app/create_thread、send_message_to_thread 委派结果缺少 call_id 而agent cli不支持缺少ai tool call导致报错才需要
      orphan-delegation-compatibility: false

      # Codex Live 的 WebRTC 音频和 DataChannel 中继，默认关闭；启用需要可达的入站 UDP。
      live-media-relay:
        enabled: false
        # 最大并发媒体会话数；0 使用默认值 32。
        max-sessions: 32
        # true：拒绝下游 SDP 中指向私有、回环、链路本地或未指定地址的候选。
        # 本地或可信内网的 Codex Desktop 连接通常保持 false。
        disable-private-remote-ips: false
        # CPA 位于 1:1 NAT 后时，对外通告的公网 IPv4/IPv6 地址。
        public-ip: ""
        # 可选 UDP 端口范围；必须同时设置，每个会话至少分配两个端口。
        udp-port-min: 0
        udp-port-max: 0
        # 可选 STUN/TURN 服务器；按实际服务填写后再取消注释。
        # ice-servers:
        #   - urls: ["stun:stun.example.com:3478"]
        #   - urls: ["turn:turn.example.com:3478?transport=udp"]
        #     username: "user"
        #     credential: "secret"

      # user-agent：默认被 Codex 伪装覆盖，无需设置。
      # beta-features：仅用于 WebSocket，默认留给客户端决定；不会开启客户端多 Agent 功能。
      # header-defaults:
      #   user-agent: "codex_cli_rs/0.114.0 (Mac OS 14.2.0; x86_64) vscode/1.111.0"
      #   beta-features: "multi_agent"

observability:
  logs:

    # 启用debug模式。默认false
    debug: false

    # 打印请求日志
    request-log: true

    # true: 是否将日志写入转轮文件而不是输出到stdout
    logging-to-file: false
    # 默认0，日志转轮文件总数
    logs-max-total-size-mb: 10


# 额度超出的行为：优先切换其他项目(供应商)，时才会切换到预览模型
quota-exceeded:
  # 超额时，自动切换项目。默认true
  switch-project: true
  # 超额时，自动切换项目到预览版模型。默认true
  switch-preview-model: true
