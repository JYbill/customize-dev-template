config-version: 8

server:
  # 服务端口号
  port: 8317

  # 开启TLS协议，默认tls.enable=false
  tls:
    enable: false
    cert: ""
    key: ""

  # 禁用高开销中间件以降低内存占用，默认false。为true则关闭日志
  commercial-mode: false


# 管理API设置
management:
  # 默认false：仅允许localhost访问管理接口（仍需要密钥验证）
  # true：允许远程地址访问管理接口
  allow-remote: true
  # 访问管理接口的密钥。如果提供明文密钥，启动时会自动哈希加密并写回config.yaml文件。留空则完全禁用管理API（所有/v0/management 路由返回 404）
  secret-key: ""
  # 禁用控制面板资源下载，使用自定义管理面板适合为true
  disable-control-panel: false

access:

  # 访问cliproxyapi代理所需要的API密钥列表
  api-keys:
    - "your-api-key-1"


# round-robin (default), fill-first(用完一下再切换下一个)
# ⚠️ 如果上游进入cool-down状态时，会使用下一个同名模型其他上游供应商
routing:
  strategy: "fill-first"
  # 默认false，true则为启用粘性会话。为false则启用routing.strategy策略
  session-affinity: true
  # 粘性会话缓存多少时间
  session-affinity-ttl: "1h"

  # 默认false，强制使用前缀匹配模型名（xxx/gpt-4.1），而不是直接用gpt-4.1匹配。推荐false这样可以配合`routing.strategy`实现负载均衡
  force-model-prefix: false
  retry:

    # http状态码为：403, 408, 500, 502, 503, 504时，重试请求的次数。默认：0
    request-retry: 0

    # 当所有的模型供应商的额度耗尽之后，每次请求CLIProxyAPI都会触发最大等待时长，默认30s
    max-retry-interval: 0

requests:

  # 代理URL. 支持socks5/http/https协议. 比如: socks5://user:pass@192.168.1.1:1080/
  proxy-url: ""

  # 非流式响应保活，默认0关闭，单位为秒，每N秒吐空行。目的在于避免nginx网关因为长时间上游无响应而直接断开链接
  nonstream-keepalive-interval: 30
  # SSE行为
  streaming:
    # 默认0禁用，当<=0禁用，用于ws、SSE的心跳包发送的间隔（包内容："\n\n"）
    keepalive-seconds: 0
    # 默认0，在没有任何数据发送下，发生错误时的重试次数，0表示不重试
    bootstrap-retries: 0

  # 设置请求体
  payload:
    # 默认规则：仅在请求载荷中缺少参数时设置的默认值
    default:
      - models:
          - name: "gemini-2.5-pro" # 支持通配符，如 "gemini-*"
            protocol: "gemini" # 限定协议类型，可选：openai、gemini、claude、codex
        params: # 参数设置（使用 gjson/sjson 路径语法）
          "generationConfig.thinkingConfig.thinkingBudget": 32768 # 思考预算配置

    # 覆盖规则：始终覆盖请求参数
    override:
      - models:
          - name: "gpt-*" # 支持通配符匹配多个模型
            protocol: "codex" # 限定为 Codex 协议
        params:
          "reasoning.effort": "high" # 推理努力程度设置为高

oauth:

  # 存储认证令牌的目录（如果需要设置到其他地方，可以参考文档：https://help.router-for.me/configuration/storage/pgsql.html）
  auth-dir: "~/.cli-proxy-api"
  providers:
    aistudio:

      # ws连接(/v1/ws)启用认证
      ws-auth: true
    claude:
      # false：保留默认的 Claude OAuth 请求伪装行为；true：禁用全局请求伪装。
      disable-claude-cloak-mode: false
      claude-code:
        # 模型列表返回原始模型 ID。
        disable-cloaking-model-list: true
      header-defaults:
        # 请求伪装中的日期信息使用此默认时区，凭据内的 timezone 可覆盖它。
        timezone: "Asia/Tokyo"

observability:
  logs:

    # 启用debug模式。默认false
    debug: false

    # 打印请求日志
    request-log: true

    # true: 是否将日志写入转轮文件而不是输出到stdout
    logging-to-file: false
    # 默认0，日志转轮文件总数
    logs-max-total-size-mb: 10


# 额度超出的行为：优先切换其他项目(供应商)，时才会切换到预览模型
quota-exceeded:
  # 超额时，自动切换项目。默认true
  switch-project: true
  # 超额时，自动切换项目到预览版模型。默认true
  switch-preview-model: true
